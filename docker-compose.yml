services:
  # Pinned to the exact same patch version as docker-compose.prod.yml's
  # postgres service, so a schema/behavior difference between Postgres
  # versions can never be the reason something works locally but not in
  # production (or vice versa). Bump both together, deliberately.
  postgres:
    image: postgres:16.14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bookingtools
      POSTGRES_PASSWORD: bookingtools
      POSTGRES_DB: bookingtools
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates the separate database the Playwright test suite uses
      # (test:e2e points DATABASE_URL at it via .env.test), so it never
      # shares data with the dev database above.
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookingtools"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  postgres_data:
