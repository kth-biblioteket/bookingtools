# Production deployment, matching the almatools example: images built and
# pushed to ghcr.io by CI, run on the shared apps-net network behind
# Traefik. Not used for local dev — see docker-compose.yml for that
# (Postgres only, run alongside `npm run dev`).
#
# Deploy prerequisites on the server:
#   - the external "apps-net" network already exists (docker network create apps-net)
#   - a bookingtools.env file next to this one (copy bookingtools.env.example and fill it in)
#
# First deploy / after pulling a new image:
#   docker compose -f docker-compose.prod.yml up -d
# (prisma migrate deploy runs automatically on container start — see docker-entrypoint.sh)

services:
  bookingtools:
    container_name: bookingtools
    # Adjust the ghcr.io org below if this repo doesn't live under kth-biblioteket.
    image: ghcr.io/kth-biblioteket/bookingtools:${REPO_TYPE}
    depends_on:
      - bookingtools-db
    restart: always
    environment:
      TZ: ${TZ}
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@bookingtools-db:5432/${DB_DATABASE}
      # Must match both the Traefik PathPrefix below AND the BASE_PATH the
      # image was built with (see Dockerfile) — Next.js needs it at runtime
      # too, not just at build time, to route requests correctly.
      BASE_PATH: ${PATHPREFIX}
    env_file:
      - bookingtools.env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bookingtools.rule=Host(`${DOMAIN_NAME}`) && PathPrefix(`${PATHPREFIX}`)"
      - "traefik.http.routers.bookingtools.entrypoints=websecure"
      - "traefik.http.routers.bookingtools.tls=true"
      - "traefik.http.routers.bookingtools.tls.certresolver=myresolver"
    networks:
      - "apps-net"

  bookingtools-db:
    container_name: bookingtools-db
    # Pinned to the exact same patch version as docker-compose.yml's
    # postgres service (local dev) — see the comment there.
    image: postgres:16.14-alpine
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - persistent-bookingtools-db:/var/lib/postgresql/data
    networks:
      - "apps-net"

volumes:
  persistent-bookingtools-db:

networks:
  apps-net:
    external: true
